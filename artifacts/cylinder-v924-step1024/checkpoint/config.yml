    camera_name_mapping:
      face_view: front view
      left_wrist_view: left wrist view
      right_wrist_view: right wrist view
    dataset_type: lerobot
    key_mappings:
      action: action
      camera:
        observation.images.face_view: face_view
        observation.images.left_wrist_view: left_wrist_view
        observation.images.right_wrist_view: right_wrist_view
      state: observation.state
    lerobot_config:
      frame_sampling_weights_path: /data/hlou/pigment-pour-study/runs/cylinder-v718-early-retreat-admission-v924/v924-frame-sampling-weights.npy
      repo_id: /data/hlou/pigment-pour-study/datasets/cylinder-joint-v907-plus-early-v718-retreat-v924
