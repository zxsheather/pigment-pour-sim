    max_length: 1024
    norm_stats_path: /data/hlou/pigment-pour-study/datasets/cylinder-joint-v907-plus-early-v718-retreat-v924/joint_norm_stats.json
    num_workers: 4
    resolution:
      face_view: 448
      left_wrist_view: 224
      right_wrist_view: 224
    state_bins: 512
    train_test_split: 1.0
    use_state_string_representation: false
  debug:
    nvtx: false
    profile: false
  distributed:
    bf16: true
    find_unused_parameters: true
    use_fsdp: false
    use_gradient_checkpointing: true
    use_mixed_precision: true
  hyperparams:
    batch_size_per_gpu: 4
    gradient_accumulation_steps: 1
    num_epoch: 1000
    optimizer:
      betas:
      - 0.9
      - 0.95
      learning_rate: 1.0e-05
      lr_groups:
      - fail_on_empty: true
        include:
        - action_preprocessor.w
        - action_preprocessor.time_
        - action_preprocessor.action_proj_back
        - moe.experts.1
        - qkv_proj_experts.1
        - o_proj_experts.1
        - input_layernorms.1
        - post_attention_layernorms.1
        - model.norms.1
        lr: 1.0e-05
        name: action
      - fail_on_empty: true
        include:
        - action_preprocessor.propri_proj
        lr: 5.0e-05
        name: state_projection
      max_grad_norm: 1.0
      optimizer_type: adamw
      train_action_expert_only: true
      weight_decay: 1.0e-08
    scheduler:
      num_training_steps: 1025
      scheduler_type: constant
    seed: 48
  logging:
    epoch_save_interval: 1000
    log_interval: 10
    log_name: cylinder-joint-early-v718-retreat-bc-v924-a6000
    save_interval: 128
    use_wandb: false
    val_interval: 1000000
  model:
