model_type: qwen2_5
task:
  dof_config: &id001
    follow_right_arm_servo_increment: 6
    follow_right_gripper: 1
    velocity_decomposed: 2
    action_padding: 17
  ar_dof_config: *id001
  agent_pos_config:
    follow_right_arm_joint_position: 6
    follow_right_gripper: 1
    velocity_decomposed: 2
    right_arm_joint_velocity: 6
    base_odometry: 3
    wrist_target_forward: 1
    right_joint_2_3_tracking_error: 2
    wrist_target_left: 1
    wrist_target_up: 1
    wrist_target_valid: 1
    right_gripper_tracking_error: 1
    base_forward_command: 1
  action_horizon: 8
  action_horizon_flow: 8
  use_state_string_representation: false
model:
  backbone: qwen2_5
  config_path: /data/hlou/pigment-pour-study/runs/cylinder-extended-contact-height-admission-v922/architecture-v922-contact-height.json
  processor_path: /data/hlou/pigment-pour-study/runs/cylinder-joint-v15-near-grasp-data-check-v18/parent-v15-step384
  pretrained_path: null
  attn_implementation: sdpa
  attn_deterministic: true
  use_ema: false
  flow_loss_weight: 1.0
  ar_loss_weight: 0.0
hyperparams:
  num_epoch: 1000
  batch_size_per_gpu: 4
  gradient_accumulation_steps: 1
  seed: 48
  optimizer:
    optimizer_type: adamw
    learning_rate: 1.0e-05
    train_action_expert_only: true
    max_grad_norm: 1.0
    betas:
    - 0.9
    - 0.95
    weight_decay: 1.0e-08
    lr_groups:
    - name: action
      lr: 1.0e-05
      include:
      - action_preprocessor.w
      - action_preprocessor.time_
      - action_preprocessor.action_proj_back
      - moe.experts.1
      - qkv_proj_experts.1
      - o_proj_experts.1
      - input_layernorms.1
      - post_attention_layernorms.1
      - model.norms.1
      fail_on_empty: true
    - name: state_projection
      lr: 5.0e-05
      include:
      - action_preprocessor.propri_proj
      fail_on_empty: true
  scheduler:
    scheduler_type: constant
    num_training_steps: 1025
distributed:
  use_fsdp: false
  use_mixed_precision: true
  bf16: true
  find_unused_parameters: true
  use_gradient_checkpointing: true
data:
  dataset_type: lerobot
  lerobot_config:
    root: /data/hlou/pigment-pour-study/datasets/cylinder-joint-v907-plus-early-v718-retreat-v924
    repo_id: /data/hlou/pigment-pour-study/datasets/cylinder-joint-v907-plus-early-v718-retreat-v924
    frame_sampling_weights_path: /data/hlou/pigment-pour-study/runs/cylinder-v718-early-retreat-admission-v924/v924-frame-sampling-weights.npy
  key_mappings:
    camera:
      observation.images.face_view: face_view
      observation.images.left_wrist_view: left_wrist_view
      observation.images.right_wrist_view: right_wrist_view
    state: observation.state
    action: action
  norm_stats_path: /data/hlou/pigment-pour-study/datasets/cylinder-joint-v907-plus-early-v718-retreat-v924/joint_norm_stats.json
  train_test_split: 1.0
  num_workers: 4
  max_length: 1024
  use_state_string_representation: false
  action_horizon_flow: 8
  action_horizon_ar: 8
  resolution:
    face_view: 448
    left_wrist_view: 224
    right_wrist_view: 224
  camera_name_mapping:
    face_view: front view
    left_wrist_view: left wrist view
    right_wrist_view: right wrist view
  state_bins: 512
logging:
  log_name: cylinder-joint-early-v718-retreat-bc-v924-a6000
  use_wandb: false
  log_interval: 10
  save_interval: 128
  val_interval: 1000000
  epoch_save_interval: 1000
checkpoint:
  save_path: /data/hlou/pigment-pour-study/runs/cylinder-joint-early-v718-retreat-bc-v924-a6000/checkpoints
  resume_from: /data/hlou/pigment-pour-study/runs/cylinder-v438-final-warm-presentation-v489/checkpoint-v438-step1024/model.safetensors
debug:
  profile: false
  nvtx: false
