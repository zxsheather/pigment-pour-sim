model_type: qwen2_5
task:
  dof_config:
    follow_right_arm_joint_position_relative: 6
    follow_right_gripper: 1
    velocity_decomposed: 2
    action_padding: 17
  ar_dof_config:
    follow_right_arm_joint_position_relative: 6
    follow_right_gripper: 1
    velocity_decomposed: 2
    action_padding: 17
  agent_pos_config:
    follow_right_arm_joint_position: 6
    follow_right_gripper: 1
    velocity_decomposed: 2
    right_arm_joint_velocity: 6
    base_odometry: 3
    action_padding: 8
  action_horizon: 32
  action_horizon_flow: 32
  use_state_string_representation: false
model:
  backbone: qwen2_5
  config_path: /data/hlou/pigment-pour-study/runs/cylinder-joint-position-bc-v1/architecture.json
  processor_path: /data/hlou/pigment-pour-study/runs/cylinder-hold-correction-bc-v1/checkpoints/0_768
  pretrained_path: null
  attn_implementation: sdpa
  attn_deterministic: true
  use_ema: false
  flow_loss_weight: 1.0
  ar_loss_weight: 0.0
hyperparams:
  num_epoch: 1000
  batch_size_per_gpu: 4
  gradient_accumulation_steps: 1
  seed: 48
  optimizer:
    optimizer_type: adamw
    learning_rate: 3.0e-05
    train_action_expert_only: true
    max_grad_norm: 1.0
    betas:
    - 0.9
    - 0.95
    weight_decay: 1.0e-08
    lr_groups:
    - name: action
      lr: 3.0e-05
      include:
      - action_preprocessor.w
      - action_preprocessor.time_
      - action_preprocessor.action_proj_back
      - moe.experts.1
      - qkv_proj_experts.1
      - o_proj_experts.1
      - input_layernorms.1
      - post_attention_layernorms.1
      - model.norms.1
      fail_on_empty: true
    - name: state_projection
      lr: 0.0003
      include:
      - action_preprocessor.propri_proj
      fail_on_empty: true
  scheduler:
    scheduler_type: constant
    num_training_steps: 2049
distributed:
  use_fsdp: false
  use_mixed_precision: true
  bf16: true
  find_unused_parameters: true
  use_gradient_checkpointing: true
data:
  dataset_type: lerobot
  lerobot_config:
    repo_id: /data/hlou/pigment-pour-study/datasets/cylinder-joint-recovery-v1
    root: /data/hlou/pigment-pour-study/datasets/cylinder-joint-recovery-v1
    frame_sampling_weights_path: /data/hlou/pigment-pour-study/datasets/cylinder-joint-recovery-v1/frame-sampling-weights.npy
  key_mappings:
    camera:
      observation.images.face_view: face_view
      observation.images.left_wrist_view: left_wrist_view
      observation.images.right_wrist_view: right_wrist_view
    state: observation.state
    action: action
  norm_stats_path: /data/hlou/pigment-pour-study/datasets/cylinder-joint-recovery-v1/joint_norm_stats.json
  train_test_split: 1.0
  num_workers: 4
  max_length: 1024
  use_state_string_representation: false
  action_horizon_flow: 32
  action_horizon_ar: 32
  resolution:
    face_view: 448
    left_wrist_view: 224
    right_wrist_view: 224
  camera_name_mapping:
    face_view: front view
    left_wrist_view: left wrist view
    right_wrist_view: right wrist view
  state_bins: 512
logging:
  log_name: cylinder_joint_position_bc_v1
  use_wandb: false
  log_interval: 10
  save_interval: 128
  val_interval: 1000000
  epoch_save_interval: 1000
checkpoint:
  save_path: /data/hlou/pigment-pour-study/runs/cylinder-joint-position-bc-v1/checkpoints
  resume_from: /data/hlou/pigment-pour-study/runs/cylinder-hold-correction-bc-v1/checkpoints/0_768/model.safetensors
debug:
  profile: false
  nvtx: false
